name: Release

# Publishes to NuGet (TestLens) and npm (testlens) when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NUGET_API_KEY - api key from https://www.nuget.org/account/apikeys
#   NPM_TOKEN     - automation token from https://www.npmjs.com/settings/~/tokens

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/TestLens.Cli.Tests --configuration Release

      - name: Pack NuGet package
        run: dotnet pack src/TestLens.Cli --configuration Release -o nupkg -p:Version=$VERSION

      - name: Push to NuGet
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Assemble npm package
        run: |
          dotnet publish src/TestLens.Cli --configuration Release -o publish -p:Version=$VERSION
          mkdir -p packages/npm/dist
          cp publish/* packages/npm/dist/
          cd packages/npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
